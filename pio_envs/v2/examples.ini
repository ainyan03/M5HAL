; =============================================================================
; M5HAL — v2 user examples build check
;
; 配置は Arduino IDE 互換の `examples/v2/HowToUse/<Kind>/<Kind>.ino` に従う。
; 親フォルダ名で "HowToUse" を表し、末端の sketch 名は I2C / SPI / UART のように
; 対象 kind だけを示す。PlatformIO の build_src_filter は src_dir (= `src/`) からの
; 相対パスで `+<../pio_envs/v2/example_sources/...>` 指定し、公開 examples を
; build check に取り込む。PlatformIO は src_dir 外の `.ino` を sketch 変換しない
; ため、検証 env では薄い `.cpp` wrapper が公開 `.ino` を include する。
;
; 命名: HowToUse_<Kind>_<chip>
;   - examples は v2/HowToUse 配下に限定しているため `v2_example` は省く。
;   - Arduino IDE 互換 sketch を基本入口にするため `_arduino` も省く。
;   - 将来 ESP-IDF 専用 example を公開する場合だけ `_idf5` などを suffix する。
;
; examples は Arduino IDE でも単独で読める利用者向け sketch に限定する。
; build_flags で backend や runner 条件を差し替える検証用 sketch は
; pio_envs/v2/hil.ini.cli と test/v2/hil/ に置く。
;
; 使い方:
;   pio run -e HowToUse_I2C_esp32
;   pio run -e HowToUse_I2C_esp32s3
;   pio run -e HowToUse_SPI_esp32
;   pio run -e HowToUse_SPI_esp32s3
;   pio run -e HowToUse_UART_esp32
;   pio run -e HowToUse_UART_esp32s3
;   pio run -e HowToUse_UARTEcho_esp32
;   pio run -e HowToUse_UARTEcho_esp32s3
;   pio run -e HowToUse_I2CRegistry_esp32  (acquire 共有 + intent 駆動 HW 割当 + query)
;   pio run -e HowToUse_I2CRegistry_esp32s3
;   pio run -e HowToUse_Bytecode_esp32     (M5Stack Core BASIC 前提のため esp32 のみ)
;
; Remote example (Hal facade, POSIX native host → ESP32):
;   pio run -e HowToUse_Remote_host
; Device: flash RemoteServer_esp32 or RemoteServer_esp32_arduino.
; TCP device: flash RemoteServerTCP_esp32 or RemoteServerTCP_esp32_arduino.
;   pio run -e RemoteServerTCP_esp32
;   pio run -e RemoteServerTCP_esp32_arduino
; Full protocol test harness: RemoteTest_host.
; =============================================================================

[env:HowToUse_I2C_esp32]
extends = common_esp32dev, common_arduino
build_src_filter = +<*> +<../pio_envs/v2/example_sources/I2C.cpp>

[env:HowToUse_I2C_esp32s3]
extends = common_esp32s3dev, common_arduino
build_src_filter = +<*> +<../pio_envs/v2/example_sources/I2C.cpp>

[env:HowToUse_SPI_esp32]
extends = common_esp32dev, common_arduino
build_src_filter = +<*> +<../pio_envs/v2/example_sources/SPI.cpp>

[env:HowToUse_SPI_esp32s3]
extends = common_esp32s3dev, common_arduino
build_src_filter = +<*> +<../pio_envs/v2/example_sources/SPI.cpp>

[env:HowToUse_UART_esp32]
extends = common_esp32dev, common_arduino
build_src_filter = +<*> +<../pio_envs/v2/example_sources/UART.cpp>

[env:HowToUse_UART_esp32s3]
extends = common_esp32s3dev, common_arduino
build_src_filter = +<*> +<../pio_envs/v2/example_sources/UART.cpp>

[env:HowToUse_UARTEcho_esp32]
extends = common_esp32dev, common_arduino
build_src_filter = +<*> +<../pio_envs/v2/example_sources/UARTEcho.cpp>

[env:HowToUse_UARTEcho_esp32s3]
extends = common_esp32s3dev, common_arduino
build_src_filter = +<*> +<../pio_envs/v2/example_sources/UARTEcho.cpp>

[env:HowToUse_I2CRegistry_esp32]
extends = common_esp32dev, common_arduino
build_src_filter = +<*> +<../pio_envs/v2/example_sources/I2CRegistry.cpp>

[env:HowToUse_I2CRegistry_esp32s3]
extends = common_esp32s3dev, common_arduino
build_src_filter = +<*> +<../pio_envs/v2/example_sources/I2CRegistry.cpp>

; CoreS3 (ESP32-S3) 専用: AW9523 + AW88298 アンプ、I2S BCK=34/WS=33/DOUT=13
; IDF gen5 I2S driver (driver/i2s_std.h) を使うため espidf5 プラットフォームが必要。
; PIO 公式 espressif32 platform の arduino framework は arduino-esp32 2.x (IDF 4.4 =
; legacy driver) のため I2S を申告しない。よってビルドチェックは espidf フレームワーク
; で行う（スケッチ本体は #ifdef ARDUINO で Arduino IDE (arduino-esp32 3.x = IDF5) と
; espidf の両対応）。
[env:HowToUse_I2SAudio_esp32s3]
extends = common_esp32s3dev_espidf5, common_espidf
build_src_filter = +<*> +<../pio_envs/v2/example_sources/I2SAudio.cpp>

; Core2 V2.1 (ESP32) 専用: AXP2101 + I2S BCK=12/WS=0/DOUT=2
; IDF gen5 I2S driver (driver/i2s_std.h) を使うため espidf5 プラットフォームが必要。
[env:HowToUse_I2SAudio_esp32]
extends = common_esp32dev_espidf5, common_espidf
build_src_filter = +<*> +<../pio_envs/v2/example_sources/I2SAudio.cpp>

; M5Stack Core BASIC 前提 (ボタン/IP5306/ILI9342C の固定ピン) のため esp32 のみ。
[env:HowToUse_Bytecode_esp32]
extends = common_esp32dev, common_arduino
build_src_filter = +<*> +<../pio_envs/v2/example_sources/Bytecode.cpp>

; PC host remote connection (POSIX native, connects to ESP32).
; Device: flash RemoteServer_esp32 or RemoteServer_esp32_arduino to an ESP32.
[env:HowToUse_Remote_host]
extends = common_native
build_src_filter = +<*> +<../pio_envs/v2/example_sources/Remote.cpp>

; PC host remote I2S playback (POSIX native, connects to RemoteServerTCP/RemoteServer).
[env:HowToUse_RemoteI2S_host]
extends = common_native
build_src_filter = +<*> +<../pio_envs/v2/example_sources/RemoteI2S.cpp>

; --- BuildTest: CI build verification (all public API types) -----------------
; Not a runnable example — compile-only check that the API surface is intact.
[env:BuildTest_esp32]
extends = common_esp32dev, common_arduino
build_src_filter = +<*> +<../pio_envs/v2/example_sources/BuildTest.cpp>

[env:BuildTest_esp32s3]
extends = common_esp32s3dev, common_arduino
build_src_filter = +<*> +<../pio_envs/v2/example_sources/BuildTest.cpp>

[env:BuildTest_host]
extends = common_native
build_src_filter = +<*> +<../pio_envs/v2/example_sources/BuildTest.cpp>

; --- RemoteServer: device-side firmware for remote bus protocol ---------
; Flash to ESP32 to expose I2C/SPI/GPIO over serial to a PC host.
[env:RemoteServer_esp32]
extends = common_esp32dev_espidf5, common_espidf
build_src_filter = +<*> +<../pio_envs/v2/example_sources/RemoteServer.cpp>

; Same board as RemoteServer_esp32, but skips the static self-scan I2C bus so a
; PC host can create it dynamically instead (e.g. RemoteI2S amplifier init).
; RemoteServer_esp32 itself is left unchanged so the default self-diagnostic
; I2C scan keeps building.
[env:RemoteServer_esp32_host_i2c]
extends = common_esp32dev_espidf5, common_espidf
build_flags =
    ${common_esp32dev_espidf5.build_flags}
    -DM5HAL_EXAMPLE_REMOTE_STATIC_I2C=0
build_src_filter = +<*> +<../pio_envs/v2/example_sources/RemoteServer.cpp>

[env:RemoteServer_esp32s3]
extends = common_esp32s3dev_espidf5, common_espidf
build_flags =
    ${common_esp32s3dev_espidf5.build_flags}
    -DM5HAL_EXAMPLE_REMOTE_TRANSPORT_USB_JTAG=1
    -DM5HAL_EXAMPLE_REMOTE_I2C_PIN_SDA=2
    -DM5HAL_EXAMPLE_REMOTE_I2C_PIN_SCL=1
    -DM5HAL_EXAMPLE_REMOTE_SPI=0
build_src_filter = +<*> +<../pio_envs/v2/example_sources/RemoteServer.cpp>

[env:RemoteServer_esp32_arduino]
extends = common_esp32dev, common_arduino
build_src_filter = +<*> +<../pio_envs/v2/example_sources/RemoteServer.cpp>

; --- RemoteServerTCP: device-side firmware over WiFi/TCP ----------------
; Flash to ESP32 to expose dynamic I2C/SPI/UART/I2S/GPIO over TCP.
[env:RemoteServerTCP_esp32]
extends = common_esp32dev_espidf5, common_espidf
; The feature-complete TCP server needs more room than the default 1 MiB app
; partition. Use ESP-IDF's 1500 KiB single-app layout; it still fits 2 MiB flash.
board_build.partitions = partitions_singleapp_large.csv
build_unflags =
    ${common_esp32dev_espidf5.build_unflags}
    -O2
build_flags =
    ${common_esp32dev_espidf5.build_flags}
    -Os
build_src_filter = +<*> +<../pio_envs/v2/example_sources/RemoteServerTCP.cpp>

[env:RemoteServerTCP_esp32_arduino]
extends = common_esp32dev, common_arduino
build_src_filter = +<*> +<../pio_envs/v2/example_sources/RemoteServerTCP.cpp>
; WiFi.h sits behind an #if the LDF chain scan does not resolve.
lib_deps =
    ${common.lib_deps}
    WiFi

[env:RemoteServerTCP_esp32s3_arduino]
extends = common_esp32s3dev, common_arduino
build_src_filter = +<*> +<../pio_envs/v2/example_sources/RemoteServerTCP.cpp>
; Route Serial to the S3 USB-JTAG CDC so the printed IP:port is visible.
; NOTE: reference the BOARD base (not [common]) so -std=gnu++17 / -O2 survive
; the override (regression: ${common.build_flags} dropped them).
build_flags =
    ${common_esp32s3dev.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ${common.lib_deps}
    WiFi

; --- RemoteTest: automated protocol test (PC host) ----------------------
[env:RemoteTest_host]
extends = common_native
build_src_filter = +<*> +<../pio_envs/v2/example_sources/RemoteTest.cpp>
