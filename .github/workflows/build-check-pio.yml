# Cross-repository PlatformIO build-check matrix.
#
# Runs the public compile fences on GitHub-hosted ubuntu-latest runners. The
# workflow is intentionally the same on the upstream repository and on forks:
# each matrix entry gets its own VM, so the expensive ESP-IDF generation probes
# can run in parallel without depending on the availability of self-hosted
# runners.
#
# Arduino-Lint and clang-format live in separate workflows. This workflow keeps
# only build/test checks so users and maintainers see one common build matrix
# regardless of whether the run came from m5stack/M5HAL or a fork.
name: build-check-pio

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.soft_fail == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: native checks
            envs: -e v0_check_native -e v2_check_native -e v2_check_native_inline
            run_native_test: "true"
          - name: arduino checks
            envs: -e v0_check_esp32_arduino -e v0_check_esp32s3_arduino -e v2_check_esp32_arduino -e v2_check_esp32s3_arduino
            # Official PlatformIO Arduino core 2.x bundles ESP-IDF 4.4. These
            # builds retain its compatibility branches independently of the
            # direct ESP-IDF component floor.
          # Non-ESP32 Arduino cores (build-check only; no HIL rig for these;
          # — see _checker.hpp's variant allowlist and spec/design/variants.md
          # §arduino variant の対応コア). v0 stays arduino-esp32-only and
          # compiles as an empty TU here, so these envs consume the complete
          # installed-library source set without claiming v0 support.
          #
          - name: multi-platform arduino checks
            envs: -e v2_check_rp2040_arduino -e v2_check_rp2350_arduino -e v2_check_unor4_minima_arduino -e v2_check_samd51_arduino -e v2_check_stm32f4_arduino -e v2_check_nrf52840_arduino -e v2_check_esp8266_arduino -e v2_check_native_nochrono
          - name: ESP-IDF 5 checks
            envs: -e v0_check_esp32_espidf -e v0_check_esp32s3_espidf -e v2_check_esp32_espidf -e v2_check_esp32_espidf_legacy_i2c -e v2_check_esp32s3_espidf
          # Forward probes against the unreleased IDF 6 toolchain: failures
          # warn but do not gate. Flip soft_fail off once an IDF 6 stable
          # release exists and these envs build green on it.
          - name: ESP-IDF 6 forward probes
            envs: -e v0_check_esp32_espidf6 -e v2_check_esp32_espidf6 -e v2_check_esp32s3_espidf6
            soft_fail: "true"
          # Both public entries in one device TU: guards the generation-
          # separated include guards and the v0/v2 platform-checker macro
          # namespaces (native equivalent lives in test_coexist_include).
          - name: coexistence checks
            envs: -e v0v2_check_esp32_arduino -e v0v2_check_esp32s3_arduino -e v0v2_check_esp32_espidf
          - name: examples build
            envs: -e HowToUse_I2C_esp32 -e HowToUse_I2C_esp32s3 -e HowToUse_SPI_esp32 -e HowToUse_SPI_esp32s3 -e HowToUse_UART_esp32 -e HowToUse_UART_esp32s3 -e HowToUse_UARTEcho_esp32 -e HowToUse_UARTEcho_esp32s3 -e HowToUse_I2CRegistry_esp32 -e HowToUse_I2CRegistry_esp32s3 -e HowToUse_I2SAudio_esp32s3 -e HowToUse_I2SAudio_esp32 -e HowToUse_Bytecode_esp32 -e HowToUse_Remote_host -e HowToUse_RemoteI2S_host
          - name: build test (API surface verification)
            envs: -e BuildTest_esp32 -e BuildTest_esp32s3 -e BuildTest_host
          # RemoteServer (device firmware) + RemoteTest (host diagnostic).
          # This entry is the only fence for the arduino-framework socket
          # layer and for the native host menu, so it must not be dropped.
          - name: remote harness build
            envs: -e RemoteServer_esp32 -e RemoteServer_esp32_host_i2c -e RemoteServer_esp32s3 -e RemoteServer_esp32_arduino -e RemoteServerTCP_esp32 -e RemoteServerTCP_esp32_arduino -e RemoteServerTCP_esp32s3_arduino -e RemoteTest_host
    steps:
      - name: Checkout M5HAL
        uses: actions/checkout@v6
        with:
          path: M5HAL

      # Prefer the same-owner fork's develop branch when it exists (e.g. a
      # patch not yet landed upstream), falling back to m5stack/M5Utility.
      # Mirrors M5Unified's "Determine M5GFX repo and branch" step.
      - name: Determine M5Utility repo
        id: m5utility
        run: |
          OWNER="${{ github.repository_owner }}"
          if git ls-remote --heads "https://github.com/$OWNER/M5Utility.git" develop 2>/dev/null | grep -q .; then
            REPO="$OWNER/M5Utility"
          else
            REPO="m5stack/M5Utility"
          fi
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "Using $REPO@develop"

      - name: Checkout M5Utility (parallel)
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.m5utility.outputs.repo }}
          ref: develop
          path: M5Utility

      - name: Cache PlatformIO and pip
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('M5HAL/platformio.ini', 'M5HAL/pio_envs/**/*.ini*') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Check non-ESP v0 rejection contract
        if: matrix.name == 'native checks'
        working-directory: M5HAL
        run: |
          check_rejection() {
            label="$1"
            shift
            log="$RUNNER_TEMP/m5hal-v0-rejection-$label.log"
            if c++ -std=c++17 -Isrc "$@" -fsyntax-only test/v2/stub/build_check_v0_rejected.cpp >"$log" 2>&1; then
              echo "$label unexpectedly compiled for a non-ESP Arduino target"
              exit 1
            fi
            grep -F 'M5HAL v0 is ESP32-only; use <M5HAL_v2.hpp> on this Arduino core.' "$log"
          }
          check_rejection M5HAL_v0.hpp
          check_rejection M5HAL.hpp -DM5HAL_TEST_V0_COMPATIBILITY_SHIM=1

      - name: Check variant selection contract
        if: matrix.name == 'native checks'
        working-directory: M5HAL
        run: bash test/v2/stub/check_variant_selection.sh

      - name: Check ResourceDomain backend isolation
        if: matrix.name == 'native checks'
        working-directory: M5HAL
        run: bash test/v2/stub/check_resource_domain_globals.sh

      - name: Check I2C concrete backend hook access
        if: matrix.name == 'native checks'
        working-directory: M5HAL
        run: |
          for provider in Bus_software Bus_remote; do
            for hook in transferBackend waitTransferBackend transferBusyBackend; do
              log="$RUNNER_TEMP/m5hal-i2c-backend-hook-rejection-$provider-$hook.log"
              if c++ -std=c++17 -Isrc -I../M5Utility/src \
                  -DM5HAL_CHECK_PROVIDER="$provider" -DM5HAL_CHECK_HOOK="$hook" -fsyntax-only \
                  test/v2/stub/build_check_i2c_backend_hook_rejected.cpp >"$log" 2>&1; then
                echo "external $provider::$hook access unexpectedly compiled"
                exit 1
              fi
              grep -E "$hook.*protected|protected.*$hook" "$log"
            done
          done

      - name: Install PlatformIO
        run: pip3 install -U platformio

      # check envs live in *.ini.cli (kept out of the PlatformIO GUI). Load them
      # via M5HAL_PIO_EXTRA_CONFIG (platformio.ini's ${sysenv.*} hook) — no copy.
      # Matrix entries that need a different *.ini.cli set extra_config.
      - name: Build fences
        working-directory: M5HAL
        env:
          M5HAL_PIO_EXTRA_CONFIG: ${{ matrix.extra_config || 'pio_envs/*/check.ini.cli' }}
        run: pio run ${{ matrix.envs }}

      - name: Run test_native
        if: matrix.run_native_test == 'true'
        working-directory: M5HAL
        run: pio test -e test_native -e test_native_ndebug
