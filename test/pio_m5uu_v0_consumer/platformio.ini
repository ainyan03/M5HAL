; Hermetic downstream build of the pinned M5UnitUnified v0 consumer.
;
; All three libraries are resolved from sibling source checkouts. The Arduino
; core 2.x default C++ standard is intentionally left unchanged: current M5UU
; includes <M5HAL.hpp> and consumes the C++11-compatible v0 surface.

[env:m5uu_v0_consumer]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
lib_compat_mode = off
lib_ldf_mode = deep
; Discover the initialized sibling components in place. Using lib_deps here
; would recursively resolve each library.json dependency through the registry
; before PlatformIO considers the next local package.
lib_extra_dirs = ../../..
