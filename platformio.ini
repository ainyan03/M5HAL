; =============================================================================
; M5HAL - PlatformIO Configuration
;
; PlatformIO GUI policy:
;   Keep visible envs small enough for humans to choose by sight. Public
;   examples and the short M5Stack BASIC operation / benchmark menus stay
;   GUI-visible:
;     RemoteServer_*       (remote bus device firmware)
;     RemoteTest_host      (remote bus protocol test)
;     HowToUse_I2C_esp32
;     HowToUse_SPI_esp32
;     HowToUse_UART_esp32
;
; AI / CLI verification envs are kept in pio_envs/**/*.ini.cli and are
; intentionally not loaded by default (the extra_configs glob below only matches
; *.ini, so .ini.cli stays out of the GUI). Load them on demand by pointing the
; M5HAL_PIO_EXTRA_CONFIG env var at the file/glob — no copying. e.g.
;   M5HAL_PIO_EXTRA_CONFIG=pio_envs/v2/hil.ini.cli pio run -e v2_hil_uart_echo_host
;   M5HAL_PIO_EXTRA_CONFIG='pio_envs/*/check.ini.cli' pio run -e v2_check_native
; Unset, the var expands to empty and is ignored. See pio_envs/README.md.
;
; Naming convention inside the GUI-facing or *.ini.cli env files:
;   v0_check_*      : v0 public header (<M5HAL.hpp> shim -> M5HAL_v0.hpp)
;   v2_check_*      : v2 public header (<M5HAL_v2.hpp>)
;   RemoteServer_*  : remote bus device firmware
;   RemoteTest_*    : remote bus protocol test (host)
;   HowToUse_*      : short GUI-facing public v2 user examples
;   test_*          : unit test (native gtest)
;   v2_test_*       : v2 embedded test (PlatformIO Unity)
;
; version prefix を先頭に置く理由: alphabetical sort で version 単位にまとまる
; + `pio run -e v2_*` のような version 全件 build を視覚的に指定しやすい。
; ただし公開 examples は GUI 左ペインでの識別性を優先し、 v0 examples がない前提で
; `HowToUse_<Kind>_<chip>` の短い名前を使う。
;
; Examples:
;   pio run  -e v0_check_native
;   pio run  -e v2_check_esp32_espidf
;   pio test -e test_native
;   pio test -e v2_test_esp32_arduino_software_spi_wire
;   pio test -e v2_test_esp32_arduino_software_spi_wire_jumper
;
; M5Utility is referenced via the parallel local directory (../M5Utility).
; CI requires that parallel checkout. ArduinoIDE compatibility will be
; verified separately with arduino-cli.
;
; extra_configs は pio_envs/**/*.ini を読む。 普段は GUI-facing env と
; 利用者向け example env だけが `.ini` として残り、 check/test/advanced experiment env は
; *.ini.cli に退避する (`.cli` 拡張子は上記 glob に拾われないので GUI に出ない)。
; 必要な時だけ `${sysenv.M5HAL_PIO_EXTRA_CONFIG}` 行 (下記) 経由で env var にパス/グロブを
; 指定してロードする (コピー＝materialize は不要。 未設定時は空に展開され無視される)。
; 共通基底 ([common_*]) は本 file に残す。
; =============================================================================

[platformio]
default_envs = HowToUse_I2C_esp32
extra_configs =
    pio_envs/v0/*.ini
    pio_envs/v2/*.ini
    ${sysenv.M5HAL_PIO_EXTRA_CONFIG}

; =============================================================================
; Common bases — orthogonal axes (platform / framework / board)
; =============================================================================

[common]
build_flags = -Wall -Wextra
lib_deps =
    symlink://../M5Utility

; --- Platform axis (chip / host OS) -----------------------------------------

[common_native]
extends = common
platform = native
; Native build compiles src/M5HAL_v2.cpp, which aggregates the bit-bang
; software variant via .inl includes. PlatformIO only picks .cpp/.c/.cc
; as compile units, so .inl files stay include-only.
; main() is provided by per-env build-check stubs under test/*/stub/
; (gated by #ifndef PIO_UNIT_TESTING so test_native's gtest main wins).
build_src_filter = +<*>
build_flags =
    ${common.build_flags}
    -O0
    -std=c++17
    -Wpedantic
    -Wconversion
    -Wsign-conversion
    -Wshadow
    -Wcast-qual
    -Wdouble-promotion

[common_esp32]
extends = common
; Pin the default ESP32 platform instead of relying on the latest registry
; release. CI has separate ESP-IDF major-version probes below, so ordinary
; check/example envs stay reproducible while newer toolchains are still watched.
platform = espressif32@6.12.0
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
    ${common.build_flags}
    -std=gnu++17
    -O2

[common_esp32_espidf5]
extends = common_esp32
platform = espressif32@6.12.0
; Pin the exact toolchain this platform bundles. IDF5 (GCC14) and IDF6 (GCC15)
; share the `toolchain-xtensa-esp-elf` package name, so the last-installed one
; occupies the unversioned "active" slot. Pinning makes selection deterministic
; in a shared core_dir (the espidf cmake tool_version_check is strict). Update
; alongside the platform pin above. Arduino does not hit this strict check.
platform_packages =
    platformio/toolchain-xtensa-esp-elf@14.2.0+20241119

[common_esp32_espidf6]
extends = common_esp32
platform = espressif32@7.0.1
; See common_esp32_espidf5 note. IDF6 bundles the GCC15 toolchain.
platform_packages =
    platformio/toolchain-xtensa-esp-elf@15.2.0+20251204

[common_esp32_arduino3]
extends = common_esp32
; Arduino-core 3.x probe. The official espressif32 platform stopped bundling
; arduino-esp32 past 2.0.x (IDF 4.4 era), so the current Arduino generation
; (3.x, IDF 5.x based) is only reachable through the community pioarduino
; platform. Pinned to a release zip for reproducibility (55.03.39 bundles
; ESP-IDF 5.5.x / arduino-esp32 3.x). No toolchain pin needed: these envs get
; their own core_dir in CI, and the arduino framework does not run the strict
; IDF cmake tool_version_check (see common_esp32_espidf5 note).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip

[common_rp2040]
extends = common
; earlephilhower/arduino-pico core for the RP2 family (RP2040 / RP2350).
; No FreeRTOS by default (bare superloop),
; so the arduino framework variant's runtime kind must not depend on
; FreeRTOS or std::thread here — see _checker.hpp's variant allowlist.
;
; The officially-registered PlatformIO "raspberrypi" platform only bundles
; framework-arduino-mbed (Arduino-on-Mbed-OS), whose GCC 9.2.1 toolchain
; fails to compile its own <chrono> usage (Arduino.h's `abs` macro collides
; with libstdc++ <chrono> — a known incompatibility, empirically confirmed:
; RealTimeClock.h itself does not compile). earlephilhower's
; arduino-pico core (no RTOS, matches the assumption above) is only reachable
; through this community platform fork — same pattern as common_esp32_arduino3
; pinning pioarduino for arduino-esp32 3.x. Pinned to a tagged release zip for
; reproducibility (GCC14 toolchain + arduino-pico 4.6.0).
platform = https://github.com/maxgerhardt/platform-raspberrypi/archive/refs/tags/v1.4.0-gcc14-arduinopico460.zip
; board_build.core selects earlephilhower's arduino-pico core over the
; board's default (framework-arduino-mbed); the community fork bundles both.
board_build.core = earlephilhower
build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
    ${common.build_flags}
    -std=gnu++17
    -O2

[common_samd51]
extends = common
; Adafruit/Arduino SAMD core (Cortex-M4F, no RTOS by default either).
; Pinned for reproducibility, same policy as common_esp32 / common_rp2040.
platform = atmelsam@8.3.0
build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
    ${common.build_flags}
    -std=gnu++17
    -O2

[common_stm32f4]
extends = common
; Official ST Arduino core (STM32duino) via the officially-registered ststm32
; platform (Cortex-M4F, no RTOS by default — same runtime assumptions as
; common_rp2040 / common_samd51). Largest non-ESP Arduino ecosystem not yet
; covered; exercises the generic (non-ESP) paths on a modern GCC toolchain.
; Pinned for reproducibility, same policy as the other platforms here.
platform = ststm32@19.7.0
build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
    ${common.build_flags}
    -std=gnu++17
    -O2

[common_nrf52840]
extends = common
; Adafruit nRF52 core via the officially-registered nordicnrf52 platform
; (Cortex-M4F). Unlike the other non-ESP Arduino cores above, this core links
; FreeRTOS underneath — the boundary this env fences is that M5HAL must still
; take the generic Arduino paths (FreeRTOS present but ESP_PLATFORM absent
; must NOT select the ESP paths). Pinned for reproducibility.
platform = nordicnrf52@10.12.0
build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
    ${common.build_flags}
    -std=gnu++17
    -O2

[common_esp8266]
extends = common
; ESP8266 Arduino core (NONOS SDK underneath) via the officially-registered
; espressif8266 platform (Xtensa LX106, single core, no RTOS). Espressif
; silicon that does NOT define ESP_PLATFORM — the boundary this env fences is
; that the arduino variant's ESP paths key on ESP_PLATFORM (= the ESP-IDF API
; surface), not on the vendor: ESP8266 must take the generic Arduino paths.
; Pinned for reproducibility, same policy as the other platforms here.
platform = espressif8266@4.2.1
build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
    ${common.build_flags}
    -std=gnu++17
    -O2

[common_renesas_ra]
extends = common
; Official PlatformIO Renesas RA platform. Version 1.9.0 bundles
; ArduinoCore-renesas 1.6.0; pin both the platform and C++ language level so
; the build fence does not float with the registry.
platform = renesas-ra@1.9.0
build_unflags = -std=gnu++11 -std=gnu++14
build_flags =
    ${common.build_flags}
    -std=gnu++17
    -O2

; --- Framework axis (SDK) ---------------------------------------------------

[common_arduino]
framework = arduino

[common_espidf]
framework = espidf

; --- Board axis -------------------------------------------------------------

[common_esp32dev]
extends = common_esp32
board = esp32dev

[common_esp32dev_espidf5]
extends = common_esp32_espidf5
board = esp32dev

[common_esp32dev_espidf6]
extends = common_esp32_espidf6
board = esp32dev

[common_esp32dev_arduino3]
extends = common_esp32_arduino3
board = esp32dev

[common_esp32s3dev]
extends = common_esp32
board = esp32-s3-devkitc-1

[common_esp32s3dev_espidf5]
extends = common_esp32_espidf5
board = esp32-s3-devkitc-1

[common_esp32s3dev_espidf6]
extends = common_esp32_espidf6
board = esp32-s3-devkitc-1

[common_esp32s3dev_arduino3]
extends = common_esp32_arduino3
board = esp32-s3-devkitc-1

[common_esp32c3dev]
extends = common_esp32
board = esp32-c3-devkitm-1

[common_esp32c6dev]
extends = common_esp32
board = esp32-c6-devkitc-1

; Future additions: common_esp32h2dev, common_esp32p4dev, ...
; H2/P4 boards require platform upgrade (espressif32 v6.12.0 hardcodes
; riscv toolchain selection to c3/c6 only; H2/P4 are riscv but unrecognized).

[common_rp2040dev]
extends = common_rp2040
board = pico

[common_rp2350dev]
extends = common_rp2040
; Pico 2 defaults to the RP2350 Cortex-M33 build. The optional Hazard3
; RISC-V build is a separate, not-yet-verified toolchain surface.
board = rpipico2

[common_unor4_minima]
extends = common_renesas_ra
; Minima and WiFi share the RA4M1 MCU. Minima avoids treating the WiFi
; board's ESP32-S3 bridge as part of this build-only portability fence.
board = uno_r4_minima

[common_samd51dev]
extends = common_samd51
; ItsyBitsy M4 keeps the build lightweight (small flash) while offering the
; same SAMD51 chip family + Arduino SAMD core as larger boards.
board = adafruit_itsybitsy_m4

[common_stm32f4dev]
extends = common_stm32f4
; Nucleo F411RE: mainstream Cortex-M4F board of the official ST core.
board = nucleo_f411re

[common_nrf52840dev]
extends = common_nrf52840
board = adafruit_feather_nrf52840

[common_esp8266dev]
extends = common_esp8266
; WeMos D1 mini: mainstream ESP8266 board (4MB flash).
board = d1_mini

; =============================================================================
; Test environments
; =============================================================================

[test_fw]
lib_deps =
    ${common.lib_deps}
    google/googletest@1.12.1

[env:test_native]
extends = common_native, test_fw
test_framework = googletest
test_filter = v0/native/*, v2/native/*
; The native gtest exercises src/M5HAL_v2.cpp (aggregates the bit-bang
; software variant via .inl includes) and the frozen v0 generic smoke
; surface, so test_build_src is required to compile project sources
; alongside the tests.
test_build_src = true
; -Itest/v2: the shared per-test hang watchdog (test/v2/support/
; gtest_watchdog.hpp) that every native test main() installs.
build_flags =
    ${common_native.build_flags}
    -Itest/v2
    -DM5HAL_TEST_REMOTE_ADOPTION_FAULTS
    -DM5HAL_TEST_POSIX_MUTEX_FAULTS
    -DM5HAL_TEST_POSIX_EVENT_FAULTS

; Release-contract lane for checks whose debug behavior is an assertion.
; Kept focused so every ordinary CI run verifies the NDEBUG error return and
; permanent-fault behavior without duplicating the entire native suite.
[env:test_native_ndebug]
extends = common_native, test_fw
test_framework = googletest
test_filter = v2/native/io/test_stream_adapter, v2/native/bytecode/test_bytecode, v2/native/memory/test_allocator
test_build_src = true
build_flags =
    ${common_native.build_flags}
    -DNDEBUG
    -Itest/v2

; ThreadSanitizer lane for the posix-runtime concurrency contract (service
; auto-run's R1-R8 rules). Deliberately separate from test_native (TSan
; instrumentation is slow and its own build cache) and never wired into the
; per-push `quick` gate -- see local-ci.sh's `tsan` mode.
[env:test_native_tsan]
extends = common_native, test_fw
build_flags =
    ${common_native.build_flags}
    -fsanitize=thread
    -g
    -Itest/v2
    -DM5HAL_TEST_REMOTE_ADOPTION_FAULTS
    -DM5HAL_TEST_POSIX_MUTEX_FAULTS
    -DM5HAL_TEST_POSIX_EVENT_FAULTS
test_framework = googletest
test_filter = v2/native/*
test_build_src = true

; Host regression harness for the espidf I2C slave backend (src/m5_hal/
; variants/frameworks/espidf/hal/i2c/slave.inl): compiles that ISR-driven
; state machine UNMODIFIED against a fake IDF header tree (test/v2/
; native_espidf/fakes) instead of the real SDK, so its transaction-window
; races are regression-tested off-target. See fakes/README.md. Deliberately
; disjoint from test_native's `v2/native/*` filter (below) in both
; directions: this env's tests live under v2/native_espidf/*, and
; test_build_src=false means this env never compiles src/M5HAL_v2.cpp (the
; test TU includes the exact generic + espidf .inl files it needs, mirroring
; that file's own include list).
; test_filter names the LL test dir EXACTLY (not a v2/native_espidf/* glob):
; test_native_espidf_fake_be below shares this same fakes/include tree but
; forces the classic-ESP32 (no clock-stretch) flavor via
; M5HAL_TEST_ESPIDF_I2C_SLAVE_HOST_NO_STRETCH_CAPABILITY, which is incompatible with this env's LL
; flavor build -- a wildcard filter would sweep that env's test dir into this
; binary too (see fakes/README.md "One in-flight ISR registration" and its
; "Extending to another peripheral" step 5: one ISR-driven backend per env).
[env:test_native_espidf_fake]
extends = common_native, test_fw
test_framework = googletest
test_filter = v2/native_espidf/test_espidf_i2c_slave
test_build_src = false
build_flags =
    ${common_native.build_flags}
    -DM5HAL_TEST_ESPIDF_I2C_SLAVE_HOST_HARNESS
    -DM5HAL_TEST_SERVICE_IMPLICIT_AUTORUN
    -DM5HAL_CONFIG_ESPIDF_I2C_SLAVE_IRAM_ISR=0
    -Itest/v2/native_espidf/fakes/include
    -Isrc
    -Itest/v2

; Same host regression harness as test_native_espidf_fake above, but with
; M5HAL_TEST_ESPIDF_I2C_SLAVE_HOST_NO_STRETCH_CAPABILITY forcing soc/soc_caps.h's
; SOC_I2C_SLAVE_CAN_GET_STRETCH_CAUSE to 0 -- the espidf I2C slave backend's
; M5HAL_ESPIDF_I2C_SLAVE_LL_BE gate then wins instead of
; M5HAL_ESPIDF_I2C_SLAVE_LL, exercising the classic-ESP32 best-effort ISR
; regmap fast path (bindIsrRegMap) off-target. Separate test dir + exact
; test_filter, per fakes/README.md's "one ISR-driven backend per env" note.
[env:test_native_espidf_fake_be]
extends = common_native, test_fw
test_framework = googletest
test_filter = v2/native_espidf/test_espidf_i2c_slave_be
test_build_src = false
build_flags =
    ${common_native.build_flags}
    -DM5HAL_TEST_ESPIDF_I2C_SLAVE_HOST_HARNESS
    -DM5HAL_CONFIG_ESPIDF_I2C_SLAVE_IRAM_ISR=0
    -DM5HAL_TEST_ESPIDF_I2C_SLAVE_HOST_NO_STRETCH_CAPABILITY
    -Itest/v2/native_espidf/fakes/include
    -Isrc
    -Itest/v2

; Host regression harness for the queued ESP-IDF SPI slave lifecycle. Unlike
; the I2C LL fakes above, this lane runs the backend worker on a host thread so
; descriptor completion and close/abort races exercise the real task code.
[env:test_native_espidf_fake_spi_slave]
extends = common_native, test_fw
test_framework = googletest
test_filter = v2/native_espidf/test_espidf_spi_slave_lifecycle
test_build_src = false
build_flags =
    ${common_native.build_flags}
    -DM5HAL_TEST_ESPIDF_SPI_SLAVE_HOST_HARNESS
    -DSOC_SPI_PERIPH_NUM=3
    -fsanitize=address
    -fno-omit-frame-pointer
    -Itest/v2/native_espidf/fakes/include
    -Isrc
    -Itest/v2
